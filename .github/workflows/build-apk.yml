name: Build CleanYourTV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar CleanYourTV
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar paquetes Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Gradle
        working-directory: launcher
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: launcher
        run: ./gradlew --no-daemon assembleRelease

      - name: Verificar APK
        run: |
          APK="launcher/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontro el archivo APK."
            exit 1
          fi
          ls -lh "$APK"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
